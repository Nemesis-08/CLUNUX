[colors]
background = #000000
foreground = #ffffff
primary = #f93d0e
secondary = #6c008a
urgent = #9b0000

[bar/main]
bottom = true
width = 100%
height = 20pt
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3pt
border-size = 2
border-color = #f93d0e
padding-left = 1
padding-right = 1
module-margin = 1
separator = /
separator-foreground = #ffffff
font-0 = Encom:size=10;2
font-1 = monospace:size=10;2
modules-left = xwindow date cava 
modules-center = xworkspaces 
modules-right = tray temperature backlight pulseaudio memory
cursor-click = pointer
enable-ipc = true

[module/cava]
type = custom/script
tail = true
exec = /home/bub/.config/polybar/scripts/cava.sh
format = <label>
label = %output%
label-font = 2
label-foreground = #ffffff

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.primary}
label-active-underline= ${colors.primary}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.urgent}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.secondary}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %class%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/temperature]
type = internal/temperature
interval = 1
thermal-zone = 0
warn-temperature = 80
format = <label>
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %temperature-c%
format-warn = <label-warn>
format-warn-prefix = "CPU "
format-warn-prefix-foreground = ${colors.primary}
label-warn = %temperature-c%
label-warn-foreground = ${colors.urgent}

[module/date]
type = internal/date
interval = 1
date = %I:%M %p
date-alt = %d-%m-%Y %H:%M:%S
label = %date%
label-foreground = ${colors.primary}

[module/backlight]
type = custom/script
exec = brightnessctl -m | cut -d, -f4
interval = 1
format = <label>
format-prefix = "BRI "
format-prefix-foreground = ${colors.primary}
label = %output%
scroll-up = brightnessctl set +1
scroll-down = brightnessctl set 1-

[module/tray]
type = internal/tray
tray-position = right
tray-padding = 2

[settings]
screenchange-reload = true

