#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true
show_symlink   = true

[preview]
tab_size        = 2
max_width       = 1000
max_height      = 1000
cache_dir       = ""
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
edit = [
	{ run = "micro %s", block = true, desc = "Edit" },
]
play = [
	{ run = "mpv %s", orphan = true, desc = "Play" },
]
open = [
	{ run = "xdg-open %s1", desc = "Open" },
]

[open]
rules = [
	{ url = "*/", use = [ "edit", "open" ] },
	{ url = "*.{txt,md,toml,ini,conf,sh,py,js,rs,c,cpp,h}", mime = "text/*", use = [ "edit", "open" ] },
	{ url = "*.{mp3,wav,m4a,flac}", mime = "audio/*", use = [ "play", "open" ] },
	{ url = "*.{mp4,mkv,avi,mov}", mime = "video/*", use = [ "play", "open" ] },
	{ mime = "image/*", use = "open" },
	{ mime = "application/pdf", use = "open" },
	# Fallback so unmatched files still have an opener
	{ url = "*", use = "open" },
]
